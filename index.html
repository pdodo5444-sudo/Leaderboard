<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Siyu伺服器的時間排行榜 — Siyu server's Leaderboard">
  <title>Siyu伺服器的時間排行榜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" id="brandHome" type="button" aria-label="回到首頁">
        <span class="brand-cn">Siyu伺服器的時間排行榜</span>
        <span class="brand-en">Siyu server's Leaderboard</span>
      </button>
      <div class="header-actions">
        <span class="live-dot"></span>
        <span>TIME ATTACK</span>
        <button id="refreshBtn" class="refresh-btn" type="button">↻ 更新紀錄</button>
      </div>
    </div>
  </header>

  <main id="app" class="page-shell">
    <section id="homeView" class="view">
      <div class="hero-copy">
        <p class="eyebrow">SIYU SERVER / TIME ATTACK</p>
        <h1>選擇賽道</h1>
        <p class="lead">選擇地圖後，再挑選賽事與車輛級別，查看目前最快紀錄。</p>
      </div>
      <div id="trackGrid" class="track-grid"></div>
    </section>

    <section id="eventsView" class="view hidden">
      <div class="view-topbar">
        <button id="backHomeBtn" class="back-btn" type="button">← 所有賽道</button>
      </div>
      <div id="trackHero" class="track-hero"></div>
      <div class="section-heading">
        <div>
          <p class="eyebrow">SELECT EVENT</p>
          <h2 id="eventsTitle"></h2>
        </div>
        <p id="eventsCount" class="muted"></p>
      </div>
      <div id="eventGrid" class="event-grid"></div>
    </section>

    <section id="leaderboardView" class="view hidden">
      <div class="view-topbar">
        <button id="backEventsBtn" class="back-btn" type="button">← 賽事列表</button>
      </div>

      <div id="leaderboardHero" class="leaderboard-hero"></div>

      <div class="leaderboard-toolbar">
        <div>
          <p class="eyebrow">LEADERBOARD</p>
          <h2 id="leaderboardTitle"></h2>
          <p id="leaderboardMeta" class="muted"></p>
        </div>
        <div class="class-switcher" id="classSwitcher" aria-label="車輛級別"></div>
      </div>

      <div class="table-wrap">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>名次</th>
              <th>車手</th>
              <th>車輛</th>
              <th>時間</th>
              <th>日期</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">—</div>
        <h3>目前沒有紀錄</h3>
        <p>請在 <code>leaderboard.csv</code> 新增這個賽事與級別的時間。</p>
      </div>
    </section>

    <section id="errorView" class="view hidden">
      <div class="error-card">
        <h2>紀錄載入失敗</h2>
        <p id="errorText"></p>
        <button id="errorRetryBtn" class="primary-btn" type="button">重新載入</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Siyu server's Leaderboard</span>
    <span>Static GitHub Pages • CSV powered</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
